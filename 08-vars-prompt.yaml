- name: vars from prompt
  hosts: local
  connection: local
  vars_prompt:
  - name: USERNAME
    prompt: "Enter your username"
    private: yes
  - name: PASSWORD
    prompt: "Enter your password"
    private: yes
  tasks:
    - name: print my information
      ansible.builtin.debug:
        msg: "My username is {{ USERNAME }} and my password is {{ PASSWORD }}"